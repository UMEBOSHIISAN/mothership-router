<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Workflow Governance Model, Mothership Router, and Mothership as three separate boundaries, each ending at a human">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#101d40"/>
    </linearGradient>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
    <marker id="ct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fd3d3"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#cbg)"/>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="110" cy="60" r="1.1"/><circle cx="1110" cy="76" r="1"/><circle cx="600" cy="26" r="1"/>
    <circle cx="1150" cy="520" r="1.1"/><circle cx="46" cy="500" r="1"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="600" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#e8eef7">Three boundaries. Three separate human decisions.</text>
    <text x="600" y="71" text-anchor="middle" font-size="13.5" fill="#8fa4c8">どれも単体で採用できる。互いをインストールも設定も起動もしない。合成は「渡せるJSONの形」だけで成立している。</text>

    <!-- input bar -->
    <rect x="44" y="94" width="1112" height="46" rx="9" fill="#132449" stroke="#2c4a86"/>
    <text x="68" y="123" font-size="13" font-weight="700" fill="#e8eef7">evidence + task</text>
    <text x="196" y="123" font-size="12" fill="#8fa4c8">local JSON files you wrote and can read · no credentials, no endpoints, no machine paths</text>

    <!-- card 1 -->
    <rect x="44" y="166" width="340" height="252" rx="12" fill="#0d1733" stroke="#2c4a86"/>
    <text x="68" y="196" font-size="15" font-weight="700" fill="#e8eef7">Workflow Governance Model</text>
    <text x="68" y="216" font-size="11.5" fill="#7f93b8">is the trail real?</text>
    <line x1="68" y1="228" x2="360" y2="228" stroke="#2c4a86"/>
    <text x="68" y="250" font-size="12" fill="#cdd9ee">Types the six-link chain:</text>
    <text x="68" y="269" font-size="11.5" fill="#9de8e8">evidence → claim → proposal →</text>
    <text x="68" y="286" font-size="11.5" fill="#9de8e8">approval → receipt → verification</text>
    <text x="68" y="312" font-size="12" fill="#cdd9ee">Rejects rather than resolves:</text>
    <text x="68" y="331" font-size="11.5" fill="#e0a0a0">· a reference whose version moved</text>
    <text x="68" y="348" font-size="11.5" fill="#e0a0a0">· a field nobody documented</text>
    <text x="68" y="365" font-size="11.5" fill="#e0a0a0">· a denial reopened without new evidence</text>
    <rect x="68" y="378" width="292" height="26" rx="6" fill="#2a1218" stroke="#7d2f3a"/>
    <text x="214" y="396" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffb3b3">no execution · no side effects</text>

    <line x1="392" y1="292" x2="418" y2="292" stroke="#4a90d9" stroke-width="2" marker-end="url(#ca)"/>
    <text x="405" y="277" text-anchor="middle" font-size="10.5" fill="#7f93b8">reviewed</text>
    <text x="405" y="316" text-anchor="middle" font-size="10.5" fill="#7f93b8">request</text>

    <!-- card 2 -->
    <rect x="430" y="166" width="340" height="252" rx="12" fill="#0d1733" stroke="#4a90d9"/>
    <text x="454" y="196" font-size="15" font-weight="700" fill="#e8eef7">Mothership Router</text>
    <text x="454" y="216" font-size="11.5" fill="#7f93b8">who is eligible, and is the yes still valid?</text>
    <line x1="454" y1="228" x2="746" y2="228" stroke="#2c4a86"/>
    <text x="454" y="250" font-size="12" fill="#cdd9ee">Narrows your local registry, then checks</text>
    <text x="454" y="267" font-size="12" fill="#cdd9ee">the approval against its digest.</text>
    <text x="454" y="293" font-size="12" fill="#cdd9ee">Four outcomes, one of them a yes:</text>
    <text x="454" y="312" font-size="11.5" fill="#e0a0a0">· human_review_required</text>
    <text x="454" y="329" font-size="11.5" fill="#e0a0a0">· no_ready_executor</text>
    <text x="454" y="346" font-size="11.5" fill="#ffe0a0">· approval_required</text>
    <text x="454" y="363" font-size="11.5" fill="#9de8e8">· approved_dry_run</text>
    <rect x="454" y="376" width="292" height="26" rx="6" fill="#2a1218" stroke="#7d2f3a"/>
    <text x="600" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffb3b3">no provider command · no process</text>

    <line x1="778" y1="292" x2="804" y2="292" stroke="#4a90d9" stroke-width="2" marker-end="url(#ca)"/>
    <text x="791" y="277" text-anchor="middle" font-size="10.5" fill="#7f93b8">dry-run</text>
    <text x="791" y="316" text-anchor="middle" font-size="10.5" fill="#7f93b8">manifest</text>

    <!-- card 3 -->
    <rect x="816" y="166" width="340" height="252" rx="12" fill="#0d1733" stroke="#2c4a86"/>
    <text x="840" y="196" font-size="15" font-weight="700" fill="#e8eef7">Mothership</text>
    <text x="840" y="216" font-size="11.5" fill="#7f93b8">what does this machine actually have?</text>
    <line x1="840" y1="228" x2="1132" y2="228" stroke="#2c4a86"/>
    <text x="840" y="250" font-size="12" fill="#cdd9ee">Portable contracts, adapter diagnostics,</text>
    <text x="840" y="267" font-size="12" fill="#cdd9ee">approval-ledger shapes, blank templates.</text>
    <text x="840" y="293" font-size="12" fill="#cdd9ee">Travels with the package:</text>
    <text x="840" y="312" font-size="11.5" fill="#9de8e8">· closed schemas and validators</text>
    <text x="840" y="329" font-size="11.5" fill="#9de8e8">· one sanitized local probe</text>
    <text x="840" y="346" font-size="12" fill="#cdd9ee">Stays with you:</text>
    <text x="840" y="365" font-size="11.5" fill="#e0a0a0">· credentials, paths, authority</text>
    <rect x="840" y="378" width="292" height="26" rx="6" fill="#2a1218" stroke="#7d2f3a"/>
    <text x="986" y="396" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffb3b3">no network · no launcher</text>

    <!-- human return path -->
    <path d="M 986 424 L 986 452 L 600 452" fill="none" stroke="#5fd3d3" stroke-width="2"/>
    <path d="M 600 452 L 214 452 L 214 424" fill="none" stroke="#5fd3d3" stroke-width="2"/>
    <line x1="600" y1="452" x2="600" y2="470" stroke="#5fd3d3" stroke-width="2" marker-end="url(#ct)"/>

    <rect x="380" y="476" width="440" height="58" rx="10" fill="#0f2f33" stroke="#2f7d7d"/>
    <text x="600" y="502" text-anchor="middle" font-size="14" font-weight="700" fill="#9de8e8">You act. Manually. In a system you configured.</text>
    <text x="600" y="522" text-anchor="middle" font-size="11.5" fill="#6fb5b5">実行はこの3つの外側にある。パイプラインはここで終わり、続きは人間の仕事。</text>
  </g>
</svg>
