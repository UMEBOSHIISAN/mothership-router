<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="An approval carries the SHA-256 digest of the registry it was granted against; editing the registry by one character changes the digest and the approval stops matching">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#101d40"/>
    </linearGradient>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
    <marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06a6a"/>
    </marker>
    <marker id="dt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fd3d3"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="url(#dbg)"/>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="120" cy="66" r="1.1"/><circle cx="1090" cy="84" r="1"/><circle cx="640" cy="28" r="1"/>
    <circle cx="1160" cy="590" r="1.1"/><circle cx="44" cy="560" r="1"/><circle cx="330" cy="42" r="0.9"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="600" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#e8eef7">One character in the registry, and the approval is gone.</text>
    <text x="600" y="73" text-anchor="middle" font-size="13.5" fill="#8fa4c8">承認は登録簿全体の SHA-256 に縛られている。1文字でも書き換えれば、承認は自動的に効かなくなる。</text>

    <!-- ============ LEFT: at approval time ============ -->
    <rect x="44" y="98" width="524" height="424" rx="12" fill="#0d1733" stroke="#2c4a86"/>
    <text x="70" y="126" font-size="14" font-weight="700" fill="#9de8e8">1 · At approval time</text>
    <text x="70" y="145" font-size="11.5" fill="#7f93b8">a human reviewed this exact registry</text>

    <rect x="70" y="160" width="472" height="104" rx="9" fill="#132449" stroke="#2c4a86"/>
    <text x="86" y="182" font-size="11.5" font-weight="600" fill="#8fa4c8">REGISTRY.json</text>
    <text x="86" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">{"executors": [{"alias": "local-reviewer",</text>
    <text x="86" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">  "status": "ready", "max_risk": "medium",</text>
    <text x="86" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">  "capabilities": ["code-review"], "cost_rank": 1}]}</text>

    <line x1="306" y1="270" x2="306" y2="296" stroke="#4a90d9" stroke-width="2" marker-end="url(#da)"/>
    <text x="318" y="288" font-size="11" fill="#7f93b8">sha256 of the whole file</text>

    <rect x="70" y="302" width="472" height="42" rx="8" fill="#0f2f33" stroke="#2f7d7d"/>
    <text x="86" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#9de8e8">e41861ea7be2f70c6ee4ffe13f273135…</text>

    <line x1="306" y1="350" x2="306" y2="374" stroke="#5fd3d3" stroke-width="2" marker-end="url(#dt)"/>
    <text x="318" y="367" font-size="11" fill="#6fb5b5">burned into the approval</text>

    <rect x="70" y="380" width="472" height="76" rx="9" fill="#132449" stroke="#2f7d7d"/>
    <text x="86" y="402" font-size="11.5" font-weight="600" fill="#8fa4c8">APPROVAL</text>
    <text x="86" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">{"approver_class": "human", "event": "approve",</text>
    <text x="86" y="443" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9de8e8"> "registry_sha256": "e41861ea7be2…"}</text>

    <rect x="70" y="466" width="472" height="42" rx="8" fill="#0f2f33" stroke="#2f7d7d"/>
    <text x="306" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#9de8e8">approved_dry_run</text>

    <!-- ============ RIGHT: after the edit ============ -->
    <rect x="632" y="98" width="524" height="424" rx="12" fill="#0d1733" stroke="#2c4a86"/>
    <text x="658" y="126" font-size="14" font-weight="700" fill="#ffb3b3">2 · You tidy one number. Nothing else.</text>
    <text x="658" y="145" font-size="11.5" fill="#7f93b8">same task · same approver · same alias</text>

    <rect x="658" y="160" width="472" height="104" rx="9" fill="#132449" stroke="#7d2f3a"/>
    <text x="674" y="182" font-size="11.5" font-weight="600" fill="#8fa4c8">REGISTRY.json</text>
    <text x="674" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">{"executors": [{"alias": "local-reviewer",</text>
    <text x="674" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">  "status": "ready", "max_risk": "medium",</text>
    <rect x="668" y="230" width="356" height="21" rx="4" fill="#3a1620"/>
    <text x="674" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#ffb3b3">  "capabilities": ["code-review"], "cost_rank": 2}]}</text>
    <text x="1032" y="243" font-size="11" fill="#e0a0a0">← one digit</text>

    <line x1="894" y1="270" x2="894" y2="296" stroke="#e06a6a" stroke-width="2" marker-end="url(#dr)"/>
    <text x="906" y="288" font-size="11" fill="#e0a0a0">a different file is a different digest</text>

    <rect x="658" y="302" width="472" height="42" rx="8" fill="#2a1218" stroke="#7d2f3a"/>
    <text x="674" y="329" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#ffb3b3">7c0d9b4418af52e1a86b30fd5c9e77a2…</text>

    <line x1="894" y1="350" x2="894" y2="374" stroke="#e06a6a" stroke-width="2" marker-end="url(#dr)"/>
    <text x="906" y="367" font-size="11" fill="#e0a0a0">the approval still carries the old one</text>

    <rect x="658" y="380" width="472" height="76" rx="9" fill="#132449" stroke="#7d2f3a"/>
    <text x="674" y="402" font-size="11.5" font-weight="600" fill="#8fa4c8">APPROVAL <tspan fill="#7f93b8">(unchanged — nobody revoked it)</tspan></text>
    <text x="674" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#cdd9ee">{"approver_class": "human", "event": "approve",</text>
    <text x="674" y="443" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#ffb3b3"> "registry_sha256": "e41861ea7be2…"}</text>

    <rect x="658" y="466" width="472" height="42" rx="8" fill="#2c2213" stroke="#7d6320"/>
    <text x="894" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#ffe0a0">approval_required</text>

    <!-- ============ bottom callout ============ -->
    <rect x="44" y="540" width="1112" height="76" rx="10" fill="#180f22" stroke="#6b4a8a"/>
    <text x="68" y="568" font-size="14" font-weight="700" fill="#d8bff0">Nobody revoked anything. The approval simply stopped describing the thing in front of it.</text>
    <text x="68" y="592" font-size="12" fill="#a894c0">An approval issued against a registry you have since edited is not a weaker approval — it is not an approval. Revocation is what happens by default, not a step you have to remember.</text>
    <text x="68" y="609" font-size="12" fill="#a894c0">誰も取り消していない。承認が「目の前の対象」を指さなくなっただけ。取り消しは、覚えておく手順ではなく既定の挙動である。</text>
  </g>
</svg>
