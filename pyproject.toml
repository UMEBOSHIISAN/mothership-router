[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mothership-router"
version = "0.2.0"
description = "Human-gated dry-run routing for AI coding environments"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
